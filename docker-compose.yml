version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./astra.db
      - FASTAPI_PORT=8000
      - FRONTEND_ORIGIN=http://localhost:8080
      - FASTAPI_API_KEY=astra_flight_ops_2026
    volumes:
      - astra_db_data:/app

volumes:
  astra_db_data:
